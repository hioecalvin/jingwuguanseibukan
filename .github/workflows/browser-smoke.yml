name: Browser smoke (isolated fixtures)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit complete dependency tree
        run: npm audit --audit-level=high
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - name: Build production application
        run: npm run build
      - name: Install desktop uploader dependencies
        working-directory: desktop/js-video-uploader
        run: npm ci
      - name: Test desktop uploader
        working-directory: desktop/js-video-uploader
        run: npm test
      - name: Audit desktop uploader dependencies
        working-directory: desktop/js-video-uploader
        run: npm audit --audit-level=high

  browser-smoke:
    name: ${{ matrix.label }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium / Linux
            engine: chromium
            projects: --project=chromium-desktop --project=chromium-tablet --project=chromium-mobile
          - label: Firefox / Linux
            engine: firefox
            projects: --project=firefox-desktop
          - label: WebKit / Linux
            engine: webkit
            projects: --project=webkit-desktop --project=webkit-tablet --project=webkit-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # This command always builds with fixed placeholders. No repository secrets,
      # production URL, storage state or authenticated account is passed to it.
      - run: npm run test:browser -- ${{ matrix.projects }}
      - name: Retain synthetic-only browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ matrix.engine }}-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  webkit-macos:
    name: WebKit / macOS
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable keyboard navigation for Playwright WebKit
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      # Playwright WebKit on macOS is a useful engine/OS gate, but it is not a
      # substitute for final testing in release Safari on real macOS/iOS devices.
      - run: npm run test:browser -- --project=webkit-desktop --project=webkit-tablet --project=webkit-mobile
      - name: Retain synthetic-only browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-webkit-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7
